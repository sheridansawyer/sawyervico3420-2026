<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title of the Webpage</title>

  <style>
    /* 4) Font should be sans-serif (fix typo) */
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* 3) Center h1 */
    header h1 {
      text-align: center;
    }

    #container {
      display: flex;
      flex-wrap: wrap;
    }

    .column {
      background-color: rgb(202, 225, 251);
      margin: 0 auto;
      border-radius: 15px;
      padding: 15px;
      max-width: 400px;
    }

    /* 2) Footer centered */
    footer {
      margin: 30px auto;
      text-align: center;
    }

    /* 5) Make h3 headers match */
    h3 {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <h1>Lorem Ipsum</h1>
  </header>

  <div id="container">
    <div class="column">
      <h2>Lorem ipsum dolor</h2>
      <p>...</p>
    </div>

    <div class="column">
      <h2>Etiam non dignissim metus</h2>
      <p>...</p>
    </div>

    <!-- 1) Fix: change id to class -->
    <div class="column">
      <h2>Vivamus malesuada velit</h2>

      <h3>Nulla in justo nisi.</h3>
      <p>...</p>

      <h3>Maecenas feugiat ipsum</h3>
      <p>...</p>
    </div>
  </div>

  <footer>
    <p>Copyright &copy; 2026 Jane Doe</p>
  </footer>
</body>
</html>
