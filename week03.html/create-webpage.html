<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 3 Responsive Page</title>

  <style>
    /* -------- Element selectors -------- */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      background-color: #f4f4f4;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 2rem;
    }

    p {
      margin: 0 0 12px 0;
    }

    /* -------- ID selectors -------- */
    #pageHeader {
      padding: 20px;
      background-color: #222;
      color: white;
      text-align: center;
    }

    #mainCard {
      max-width: 900px;
      margin: 20px auto;
      background-color: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }

    /* -------- Class selectors -------- */
    .highlight {
      background-color: #fff2a8;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .grid {
      display: flex;
      gap: 16px;
    }

    .panel {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 14px;
      background-color: #fafafa;
    }

    /* -------- Media query -------- */
    @media (max-width: 650px) {
      h1 {
        font-size: 1.6rem;
      }

      .grid {
        flex-direction: column;
      }

      #mainCard {
        margin: 10px;
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <!-- Inline CSS example -->
  <div id="pageHeader" style="border-bottom: 6px solid #ff5a5f;">
    <h1>Responsive Webpage</h1>
    <p>HTML and CSS styling with a media query.</p>
  </div>

  <div id="mainCard">
    <p>
      This page uses <span class="highlight">ID selectors</span>,
      <span class="highlight">class selectors</span>, and
      <span class="highlight">element selectors</span>.
    </p>

    <div class="grid">
      <div class="panel">
        <h2>Left Panel</h2>
        <p>This layout is horizontal on larger screens.</p>
      </div>

      <div class="panel">
        <h2>Right Panel</h2>
        <p>On smaller screens, the panels stack vertically.</p>
      </div>
    </div>
  </div>
</body>
</html>
